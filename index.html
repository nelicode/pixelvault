<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PixelVault - Discover, compare, and save your favorite video games">
    <title>PixelVault - Discover Video Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <h1 class="logo">PixelVault</h1>
        </div>
        <div class="header-center">
            <input type="search" id="search-input" placeholder="Search video games..." aria-label="Search video games">
        </div>
        <nav class="header-right" id="main-nav">
            <a href="index.html" class="active">Home</a>
            <a href="favorites.html">Favorites</a>
            <a href="deals.html">Deals</a>
            <button id="surprise-btn" class="btn-link">Surprise Me</button>
            <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
        </nav>
        <button id="menu-toggle" aria-label="Toggle menu">☰</button>
    </header>

    <div class="main-container">
        <aside class="filters" id="filters">
            <h2>Filters</h2>
            <div class="filter-group">
                <h3>Genre</h3>
                <label><input type="checkbox" value="action"> Action</label>
                <label><input type="checkbox" value="rpg"> RPG</label>
                <label><input type="checkbox" value="adventure"> Adventure</label>
                <label><input type="checkbox" value="shooter"> Shooter</label>
            </div>
            <div class="filter-group">
                <h3>Platform</h3>
                <label><input type="checkbox" value="4"> PC</label>
                <label><input type="checkbox" value="18"> PlayStation</label>
                <label><input type="checkbox" value="1"> Xbox</label>
                <label><input type="checkbox" value="7"> Nintendo</label>
            </div>
            <button id="apply-filters" class="btn-primary">Apply Filters</button>
        </aside>

        <main id="game-grid" class="game-grid" aria-live="polite">
            <p class="loading">Loading games...</p>
        </main>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer class="footer">
        <p>PixelVault © 2026 | Links: Home • Favorites • Deals • Surprise Me | Powered by RAWG &amp; CheapShark API</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>

</html>
