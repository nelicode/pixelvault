<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="PixelVault - Discover, compare, and save your favorite video games. Powered by RAWG and CheapShark APIs.">
    <meta name="keywords" content="video games, gaming, deals, steam, gog, epic games, rawg, cheapshark">
    <meta name="author" content="Nelida Colque">
    <title>PixelVault - Discover Video Games</title>

    <!-- Open Graph -->
    <meta property="og:title" content="PixelVault - Discover Video Games">
    <meta property="og:description" content="Discover, compare, and save your favorite video games.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pixelvault-v5mi.onrender.com">
    <meta property="og:image" content="https://pixelvault-v5mi.onrender.com/favicon.svg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PixelVault - Discover Video Games">
    <meta name="twitter:description" content="Discover, compare, and save your favorite video games.">

    <!-- Theme color -->
    <meta name="theme-color" content="#7B2CBF">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <h1 class="logo">PixelVault</h1>
        </div>
        <div class="header-center">
            <label for="search-input" class="visually-hidden">Search video games</label>
            <input type="search" id="search-input" placeholder="Search video games..." aria-label="Search video games">
        </div>
        <nav class="header-right" id="main-nav" aria-label="Main navigation">
            <a href="index.html" class="active">Home</a>
            <a href="favorites.html">Favorites</a>
            <a href="deals.html">Deals</a>
            <button id="surprise-btn" class="btn-link" aria-label="Surprise me with a random game">Surprise Me</button>
            <button id="theme-toggle" aria-label="Toggle dark or light theme">🌙</button>
        </nav>
        <button id="menu-toggle" aria-label="Toggle mobile menu" aria-expanded="false">☰</button>
    </header>

    <div class="main-container">
        <aside class="filters" id="filters">
            <h2>Filters</h2>
            <div class="filter-group" data-filter="genre">
                <h3>Genre</h3>
                <label><input type="checkbox" value="4"> Action</label>
                <label><input type="checkbox" value="5"> RPG</label>
                <label><input type="checkbox" value="3"> Adventure</label>
                <label><input type="checkbox" value="2"> Shooter</label>
                <label><input type="checkbox" value="10"> Strategy</label>
                <label><input type="checkbox" value="14"> Simulation</label>
                <label><input type="checkbox" value="7"> Puzzle</label>
                <label><input type="checkbox" value="15"> Sports</label>
                <label><input type="checkbox" value="1"> Racing</label>
                <label><input type="checkbox" value="51"> Indie</label>
            </div>
            <div class="filter-group" data-filter="platform">
                <h3>Platform</h3>
                <label><input type="checkbox" value="4"> PC</label>
                <label><input type="checkbox" value="18"> PlayStation</label>
                <label><input type="checkbox" value="1"> Xbox</label>
                <label><input type="checkbox" value="7"> Nintendo</label>
                <label><input type="checkbox" value="3"> iOS</label>
                <label><input type="checkbox" value="21"> Android</label>
                <label><input type="checkbox" value="5"> Mac</label>
                <label><input type="checkbox" value="6"> Linux</label>
            </div>
            <div class="filter-group">
                <h3>Release Year</h3>
                <input type="number" id="year-from" placeholder="From" min="1970" max="2026"
                    style="width: 47%; padding: 0.5rem; border: 2px solid #e0e0e0; border-radius: 6px; margin-right: 4%;">
                <input type="number" id="year-to" placeholder="To" min="1970" max="2026"
                    style="width: 47%; padding: 0.5rem; border: 2px solid #e0e0e0; border-radius: 6px;">
            </div>
            <div class="filter-group">
                <h3>Minimum Rating</h3>
                <input type="range" id="rating-min" min="0" max="5" step="0.5" value="0" style="width: 100%;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 0.3rem;">
                    <span>0.0</span>
                    <span id="rating-value" style="font-weight: 700; color: #7B2CBF;">0.0</span>
                    <span>5.0</span>
                </div>
            </div>
            <button id="apply-filters" class="btn-primary">Apply Filters</button>
        </aside>

        <main id="game-grid" class="game-grid" aria-live="polite">
            <p class="loading">Loading games...</p>
        </main>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer class="footer">
        <p>PixelVault © 2026 | Links: Home • Favorites • Deals • Surprise Me | Powered by RAWG &amp; CheapShark API</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>

</html>
